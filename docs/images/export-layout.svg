<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
<title id="title">导出 ZIP 合并解压示意</title><desc id="desc">同一批次的多个 ZIP 解压到同一文件夹，查看导出报告、全量文件和分类目录。</desc>
<rect width="900" height="380" rx="20" fill="#f5f7fb"/><text x="38" y="54" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#17243c">多个分包，解压到同一个文件夹</text>
<rect x="38" y="88" width="245" height="200" rx="14" fill="#fff" stroke="#dce4ef"/><text x="58" y="123" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17243c">下载的同一批次 ZIP</text><text x="58" y="161" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#52657f">📦 批次名_第01包.zip</text><text x="58" y="193" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#52657f">📦 批次名_第02包.zip</text><text x="58" y="225" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#52657f">📦 批次名_第03包.zip</text><text x="58" y="261" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#7b8da5">分包数量依导出内容而定</text>
<path d="M310 187h85m-15-12 15 12-15 12" fill="none" stroke="#f47721" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="422" y="88" width="440" height="240" rx="14" fill="#fff" stroke="#dce4ef"/><text x="446" y="123" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17243c">📁 同一个解压文件夹</text><text x="450" y="159" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#52657f">├─ 导出报告.txt　← 最后一包提供</text><text x="450" y="190" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#52657f">├─ AI阅读_全部笔记.md / .txt</text><text x="450" y="221" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#52657f">├─ 分类汇总/</text><text x="450" y="252" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#52657f">└─ 分类目录/　（笔记与图片）</text><text x="446" y="292" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#7b8da5">保留目录结构，先查看报告中的异常和包清单</text>
<text x="38" y="350" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#7b8da5">示意图：文件名和目录以实际导出结果为准。</text></svg>
